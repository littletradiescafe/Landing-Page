<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Little Tradies Café — Opening Soon</title>
  <meta name="description" content="Little Tradies Café is opening soon. Built for Play. Brewed for Parents." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1F2D44;
      color: #FFF5E3;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    /* Top hazard stripe */
    .page::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 8px;
      background: repeating-linear-gradient(90deg, #F2B32C 0 24px, #E46A2E 24px 48px);
    }

    /* Bottom hazard stripe */
    .page::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 8px;
      background: repeating-linear-gradient(90deg, #E46A2E 0 24px, #F2B32C 24px 48px);
    }

    /* Background dot texture */
    .bg-dots {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      width: clamp(160px, 28vw, 260px);
      height: auto;
      margin-bottom: 40px;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.4));
    }

    .headline {
      font-family: 'Fredoka One', system-ui, sans-serif;
      font-size: clamp(32px, 7vw, 60px);
      font-weight: 400;
      line-height: 1.15;
      color: #FFF5E3;
      margin-bottom: 12px;
    }

    .subline {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(18px, 3.5vw, 32px);
      letter-spacing: 0.08em;
      color: #F2B32C;
      margin-bottom: 44px;
    }

    .divider {
      width: 60px;
      height: 3px;
      background: repeating-linear-gradient(90deg, #F2B32C 0 10px, #E46A2E 10px 20px);
      border-radius: 2px;
      margin-bottom: 28px;
    }

    .contact {
      font-size: clamp(14px, 2vw, 16px);
      color: rgba(255,245,227,0.55);
      letter-spacing: 0.04em;
    }

    .contact a {
      color: rgba(255,245,227,0.8);
      text-decoration: none;
      transition: color 0.2s;
    }

    .contact a:hover {
      color: #F2B32C;
    }
  </style>
</head>
<body>

  <div class="page">
    <div class="bg-dots"></div>

    <div class="content">
      <img
        src="https://cdn.sintra.ai/img/FfsZV0cmkQi6RZKC_OJsrm8UKUO2uVWOiQbVq_rJZok/f:jpg/rs:fit:800/czM6Ly9zaW50cmEtYnJhaW5haS1tZWRpYS9rbm93bGVkZ2UtcHJvZmlsZXMvY2Y1Yjc5YTItYzNlZC00YjE2LWI3MTctMDkwODA4YWIxYzY2L2Fzc2V0cy9jMWJmNzcwOS1kNWMyLTQ3ODMtOTUxMS1iNGE1ZDI0YWM0NzUvTGFuZHNjYXBlZF9QbGF5ZnVsX3RydWNrLXRoZW1lZF9jYWZfX2xvZ29fZGVzaWduX0hpX1Jlcy5wbmc"
        alt="Little Tradies Café"
        class="logo"
      />

      <h1 class="headline">Remodeling.</h1>

      <p class="subline">Opening New Cafe Soon</p>

      <div class="divider"></div>

      <p class="contact">
        <a href="mailto:info@littletradiescafe.com.au">info@littletradiescafe.com.au</a>
      </p>
    </div>
  </div>

</body>
</html>
